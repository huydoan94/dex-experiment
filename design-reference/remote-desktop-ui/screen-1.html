<div style="position: relative; height: 100vh; min-height: 420px; overflow: hidden; background: #000000; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #F1F3F5">

<!-- Remote screen (stand-in for the live video stream) -->
<div role="img" aria-label="Remote computer's screen" style="position: absolute; inset: 0; background: #2A4558; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0">
<div style="position: absolute; right: -8%; top: -18%; width: 60%; height: 90%; border-radius: 50%; background: #2F4E63"></div>
<div style="position: absolute; left: -10%; bottom: -30%; width: 55%; height: 80%; border-radius: 50%; background: #26404F"></div>

<!-- File browser window -->
<div style="position: absolute; left: 9%; top: 12%; width: 46%; height: 56%; border-radius: 10px; overflow: hidden; background: #FFFFFF; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35); display: flex; flex-direction: column">
<div style="height: 36px; flex: none; background: #ECEEF1; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: #3A3F47; font-size: 13px">
<span style="width: 11px; height: 11px; border-radius: 50%; background: #C9CDD3"></span>
<span style="width: 11px; height: 11px; border-radius: 50%; background: #C9CDD3"></span>
<span style="width: 11px; height: 11px; border-radius: 50%; background: #C9CDD3"></span>
<span style="margin-left: 10px">Files</span>
</div>
<div style="flex: 1; display: flex; min-height: 0">
<div style="width: 28%; background: #F5F6F8; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: #4A505A">
<span>Home</span><span>Desktop</span><span>Documents</span><span>Downloads</span>
</div>
<div style="flex: 1; padding: 10px 16px; display: flex; flex-direction: column; font-size: 13px; color: #262A30">
<sc-for list="{{files}}" as="f" hint-placeholder-count="6">
<div style="display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #EEF0F2"><span>{{f.name}}</span><span style="color: #6B717B">{{f.size}}</span></div>
</sc-for>
</div>
</div>
</div>

<!-- Editor window -->
<div style="position: absolute; left: 42%; top: 32%; width: 44%; height: 50%; border-radius: 10px; overflow: hidden; background: #1B1E24; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45); display: flex; flex-direction: column">
<div style="height: 36px; flex: none; background: #23272E; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: #B8BEC7; font-size: 13px">
<span style="width: 11px; height: 11px; border-radius: 50%; background: #3B414B"></span>
<span style="width: 11px; height: 11px; border-radius: 50%; background: #3B414B"></span>
<span style="width: 11px; height: 11px; border-radius: 50%; background: #3B414B"></span>
<span style="margin-left: 10px">notes.txt</span>
</div>
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 9px; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; color: #C9D1D9">
<span><span style="color: #7EA8F8">server</span>: host-01</span>
<span><span style="color: #7EA8F8">backup</span>: nightly 02:00</span>
<span><span style="color: #7EA8F8">status</span>: <span style="color: #8FD3A0">ok</span></span>
<span style="color: #6E7681"># todo</span>
<span>- check disk health</span>
<span>- update firmware</span>
</div>
</div>

<!-- Taskbar -->
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: rgba(14, 16, 20, 0.88); display: flex; align-items: center; justify-content: space-between; padding: 0 16px">
<div style="display: flex; gap: 8px">
<span style="width: 30px; height: 30px; border-radius: 7px; background: #3C6E91"></span>
<span style="width: 30px; height: 30px; border-radius: 7px; background: #4A5563"></span>
<span style="width: 30px; height: 30px; border-radius: 7px; background: #4A5563"></span>
<span style="width: 30px; height: 30px; border-radius: 7px; background: #4A5563"></span>
</div>
<span style="font-size: 13px; color: #D4D8DE; font-variant-numeric: tabular-nums">14:32</span>
</div>

<!-- Remote cursor -->
<sc-if value="{{cursor}}" hint-placeholder-val="{{ false }}">
<svg width="26" height="26" sc-camel-view-box="0 0 24 24" style="position: absolute; left: 61%; top: 47%; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.5))"><path d="M4 2.5 L4 19 L8.6 14.8 L11.6 21.5 L14.4 20.3 L11.4 13.7 L17.6 13.7 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.4" stroke-linejoin="round"></path></svg>
</sc-if>
</div>
</div>

<!-- Toolbar (shown) -->
<sc-if value="{{toolbarShown}}" hint-placeholder-val="{{ true }}">
<div role="toolbar" aria-label="Session controls" style="position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; padding: 6px; max-width: calc(100% - 24px); box-sizing: border-box; border-radius: 14px; background: rgba(22, 24, 28, 0.92); border: 1px solid #2A2D33; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); backdrop-filter: blur(10px)">
<button type="button" aria-pressed="{{cursorPressed}}" sc-camel-on-click="{{toggleCursor}}" style="{{cursorBtnStyle}}">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3 L5 18 L9.2 14.2 L12 20.5 L14.4 19.4 L11.6 13.2 L17 13.2 Z"></path></svg>
<span>Remote cursor</span>
</button>
<button type="button" sc-camel-on-click="{{openTelemetry}}" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: #E6E8EB; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3 7 4-14 3 7h4"></path></svg>
<span>Telemetry</span>
</button>
<span aria-hidden="true" style="width: 1px; height: 24px; background: #33373E; margin: 0 4px"></span>
<a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 10px; background: #DC2626; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.4 7.2a8 8 0 1 0 11.2 0"></path></svg>
<span>Disconnect</span>
</a>
<button type="button" aria-label="Hide toolbar" sc-camel-on-click="{{hideToolbar}}" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #9BA1AA; cursor: pointer">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
</button>
</div>
</sc-if>

<!-- Toolbar (hidden): small pull-down handle -->
<sc-if value="{{toolbarHidden}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="Show toolbar" sc-camel-on-click="{{showToolbar}}" style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); display: inline-flex; align-items: center; justify-content: center; width: 72px; height: 44px; padding: 0; border: 1px solid #2A2D33; border-top: 0; border-radius: 0 0 12px 12px; background: rgba(22, 24, 28, 0.78); color: #C3C8CF; cursor: pointer">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</sc-if>

<!-- Telemetry dialog -->
<sc-if value="{{telemetry}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.55); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box">
<div role="dialog" aria-modal="true" aria-labelledby="telemetry-title" style="width: 560px; max-width: 100%; max-height: 100%; overflow-y: auto; box-sizing: border-box; border-radius: 16px; background: #16181C; border: 1px solid #2A2D33; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="telemetry-title" style="margin: 0; font-size: 18px; font-weight: 600; color: #F1F3F5">Connection telemetry</h2>
<p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #9BA1AA"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3FB950"></span>Live · session {{duration}}</p>
</div>
<button type="button" aria-label="Close telemetry" sc-camel-on-click="{{closeTelemetry}}" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin: -8px -10px 0 0; border: 0; border-radius: 10px; background: transparent; color: #C3C8CF; cursor: pointer">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
</button>
</div>

<div style="border-radius: 12px; background: #1C1F24; border: 1px solid #2A2D33; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #9BA1AA">Round-trip latency</span>
<span style="font-size: 28px; font-weight: 600; color: #F1F3F5; font-variant-numeric: tabular-nums">{{latency}} <span style="font-size: 15px; font-weight: 500; color: #9BA1AA">ms</span></span>
</div>
<svg width="240" height="52" sc-camel-view-box="0 0 240 52" role="img" aria-label="Latency over the last 30 seconds" style="max-width: 100%"><polyline points="{{latPoints}}" fill="none" stroke="#5B9BF8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline></svg>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="8">
<div style="border-radius: 10px; background: #1C1F24; border: 1px solid #2A2D33; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-size: 12px; color: #9BA1AA">{{s.label}}</span>
<span style="font-size: 16px; font-weight: 600; color: #F1F3F5; font-variant-numeric: tabular-nums; overflow-wrap: anywhere">{{s.value}}</span>
</div>
</sc-for>
</div>

<div style="display: flex; justify-content: flex-end; gap: 8px">
<button type="button" sc-camel-on-click="{{closeTelemetry}}" style="height: 44px; padding: 0 20px; border: 1px solid #33373E; border-radius: 10px; background: #22252B; color: #F1F3F5; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Close</button>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;showCursor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;openTelemetry&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;toolbarCollapsed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
componentDidMount() {
this._t = setInterval(() => {
const s = this.state || {};
const lat = (s.lat || this.seedLat()).slice(1);
const prev = lat[lat.length - 1];
let next = prev + Math.round((Math.random() - 0.5) * 6);
if (next < 16) next = 16;
if (next > 44) next = 44;
lat.push(next);
this.setState({
lat: lat,
fps: 57 + Math.floor(Math.random() * 4),
down: (10 + Math.random() * 5).toFixed(1),
up: (0.2 + Math.random() * 0.3).toFixed(1),
secs: (s.secs || 754) + 1
});
}, 1000);
}
componentWillUnmount() {
clearInterval(this._t);
}
seedLat() {
return [24,26,23,25,28,24,22,27,25,24,23,26,29,25,24,23,25,24,26,24,22,25,27,24,23,25,26,24,23,24];
}
renderVals() {
const s = this.state || {};
const cursor = s.cursor ?? !!this.props.showCursor;
const telemetry = s.telemetry ?? !!this.props.openTelemetry;
const collapsed = s.collapsed ?? !!this.props.toolbarCollapsed;
const lat = s.lat || this.seedLat();
const step = 240 / (lat.length - 1);
const latPoints = lat.map((v, i) => (i * step).toFixed(1) + ',' + (50 - (v / 60) * 48).toFixed(1)).join(' ');
const secs = s.secs || 754;
const mm = String(Math.floor(secs / 60)).padStart(2, '0');
const ss = String(secs % 60).padStart(2, '0');
const base = 'display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; ';
return {
cursor: cursor,
cursorPressed: cursor ? 'true' : 'false',
cursorBtnStyle: base + (cursor ? 'border: 1px solid #3B5C99; background: #1E3A6E; color: #FFFFFF' : 'border: 1px solid transparent; background: transparent; color: #E6E8EB'),
telemetry: telemetry,
toolbarShown: !collapsed,
toolbarHidden: collapsed,
latency: lat[lat.length - 1],
latPoints: latPoints,
duration: mm + ':' + ss,
files: [
{ name: 'Documents', size: '—' },
{ name: 'Downloads', size: '—' },
{ name: 'Projects', size: '—' },
{ name: 'report.pdf', size: '2.4 MB' },
{ name: 'backup.tar.gz', size: '1.1 GB' },
{ name: 'notes.txt', size: '4 KB' }
],
stats: [
{ label: 'Frame rate', value: (s.fps || 60) + ' fps' },
{ label: 'Resolution', value: '2560 × 1440' },
{ label: 'Download', value: (s.down || '12.4') + ' Mbps' },
{ label: 'Upload', value: (s.up || '0.3') + ' Mbps' },
{ label: 'Packet loss', value: '0.1 %' },
{ label: 'Codec', value: 'H.264 · hardware' },
{ label: 'Encode / decode', value: '4 ms / 3 ms' },
{ label: 'Route', value: 'Direct (P2P)' }
],
toggleCursor: () => this.setState({ cursor: !cursor }),
openTelemetry: () => this.setState({ telemetry: true }),
closeTelemetry: () => this.setState({ telemetry: false }),
hideToolbar: () => this.setState({ collapsed: true }),
showToolbar: () => this.setState({ collapsed: false })
};
}
}
</script>


</body></html>
